<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WEB ARCADE - FBNeo</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

        }


        body {

            background:
                radial-gradient(
                    circle at top,
                    #14142f 0%,
                    #070714 45%,
                    #000 100%
                );

            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow-x: hidden;

        }


        /* ==========================================
           HEADER
        =========================================== */

        .header {

            width: 100%;

            text-align: center;

            padding:
                30px
                15px
                10px;

        }


        h1 {

            margin: 0;

            color: #ff0055;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    3.5rem
                );

            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;

        }


        .subtitle {

            margin-top: 8px;

            color: #00ffcc;

            font-weight: bold;

            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc;

        }


        /* ==========================================
           MENU
        =========================================== */

        #menu {

            width:
                calc(100% - 30px);

            max-width: 650px;

            margin:
                25px 15px;

            padding: 24px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.88
                );

            border:
                2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px rgba(
                    0,
                    255,
                    204,
                    0.20
                );

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        label {

            color: #00ffcc;

            font-weight: bold;

            font-size: 16px;

        }


        select,
        input[type="file"] {

            width: 100%;

            padding: 12px;

            background: #111;

            color: #fff;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            outline: none;

            font-family: inherit;

            font-size: 16px;

        }


        select:focus,
        input[type="file"]:focus {

            border-color: #00ffcc;

            box-shadow:
                0 0 8px #00ffcc;

        }


        option {

            background: #111;

            color: white;

        }


        /* ==========================================
           UPLOAD
        =========================================== */

        #upload-section {

            display: none;

            padding: 15px;

            border:
                1px dashed #ffcc00;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    204,
                    0,
                    0.04
                );

        }


        #upload-section label {

            color: #ffcc00;

        }


        /* ==========================================
           BUTTON
        =========================================== */

        button {

            width: 100%;

            padding: 14px;

            background: transparent;

            color: #ff0055;

            border:
                2px solid #ff0055;

            border-radius: 5px;

            cursor: pointer;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            text-transform: uppercase;

            box-shadow:
                0 0 10px #ff0055 inset,
                0 0 10px #ff0055;

            transition: 0.2s;

        }


        button:hover {

            background: #ff0055;

            color: #fff;

        }


        button:disabled {

            opacity: 0.5;

            cursor: wait;

        }


        /* ==========================================
           ERROR
        =========================================== */

        #error {

            display: none;

            padding: 14px;

            color: #ff0055;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    0,
                    85,
                    0.08
                );

            text-align: center;

            line-height: 1.5;

            font-weight: bold;

            word-break: break-word;

        }


        /* ==========================================
           LOADING
        =========================================== */

        #loading {

            display: none;

            margin: 20px;

            color: #ffcc00;

            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 5px #ffcc00;

        }


        /* ==========================================
           GAME WRAPPER
        =========================================== */

        #game-wrapper {

            display: none;

            width: 100%;

            max-width: 1100px;

            padding:
                10px 15px 30px;

        }


        /* ==========================================
           GAME AREA
        =========================================== */

        #game-frame-container {

            width: 100%;

            aspect-ratio: 4 / 3;

            min-height: 300px;

            background: #000;

            border:
                2px solid #00ffcc;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px rgba(
                    0,
                    255,
                    204,
                    0.25
                );

        }


        /*
         * EmulatorJS runs inside this iframe.
         */

        #emulator-frame {

            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            background: #000;

        }


        /* ==========================================
           CONTROLS
        =========================================== */

        .controls {

            display: flex;

            gap: 10px;

            margin-top: 12px;

        }


        .controls button {

            flex: 1;

            font-size: 14px;

            padding: 10px;

        }


        .fullscreen {

            color: #00ffcc;

            border-color: #00ffcc;

            box-shadow:
                0 0 10px #00ffcc inset,
                0 0 10px #00ffcc;

        }


        .fullscreen:hover {

            background: #00ffcc;

            color: #000;

        }


        .exit {

            color: #ff0055;

            border-color: #ff0055;

        }


        /* ==========================================
           STATUS
        =========================================== */

        #status {

            margin-top: 10px;

            color: #777;

            text-align: center;

            font-size: 12px;

        }


        /* ==========================================
           FOOTER
        =========================================== */

        footer {

            margin-top: auto;

            padding: 20px;

            color: #555;

            font-size: 11px;

            text-align: center;

        }


        /* ==========================================
           MOBILE
        =========================================== */

        @media (max-width: 600px) {

            #menu {

                padding: 18px;

            }


            #game-frame-container {

                min-height: 240px;

            }


            .controls {

                flex-direction: column;

            }

        }


        /* ==========================================
           FULLSCREEN
        =========================================== */

        #game-wrapper:fullscreen {

            width: 100vw;

            height: 100vh;

            max-width: none;

            padding: 0;

            background: #000;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        #game-wrapper:fullscreen
        #game-frame-container {

            width: 100vw;

            height: 100vh;

            min-height: 0;

            aspect-ratio: auto;

            border: 0;

            border-radius: 0;

            box-shadow: none;

        }


        #game-wrapper:fullscreen
        #emulator-frame {

            width: 100vw;

            height: 100vh;

        }


        #game-wrapper:fullscreen
        .controls {

            position: absolute;

            left: 20px;

            right: 20px;

            bottom: 15px;

            z-index: 100;

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="header">

        <h1>
            WEB ARCADE
        </h1>

        <div class="subtitle">
            MAME / FBNEO EMULATOR
        </div>

    </div>



    <!-- ==========================================
         GAME MENU
    =========================================== -->

    <div id="menu">

        <label for="game-select">
            SELECT A GAME
        </label>


        <select id="game-select">

            <option value="ddsomur1.zip">

                Dungeons & Dragons:
                Shadow over Mystara

            </option>


            <option value="upload">

                -- UPLOAD CUSTOM ROM --

            </option>

        </select>


        <!-- CUSTOM ROM -->

        <div id="upload-section">

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br>
            <br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <!-- START -->

        <button id="play-button">

            ▶ PLAY START

        </button>


        <!-- ERROR -->

        <div id="error"></div>

    </div>



    <!-- ==========================================
         LOADING
    =========================================== -->

    <div id="loading">

        ⏳ LOADING FBNEO...

        <br><br>

        Please wait...

    </div>



    <!-- ==========================================
         GAME
    =========================================== -->

    <div id="game-wrapper">


        <div id="game-frame-container">

            <iframe
                id="emulator-frame"
                allow="autoplay; fullscreen; gamepad"
                allowfullscreen
            ></iframe>

        </div>


        <div class="controls">

            <button
                class="fullscreen"
                id="fullscreen-button"
            >

                ⛶ FULLSCREEN

            </button>


            <button
                class="exit"
                id="exit-button"
            >

                ✕ EXIT GAME

            </button>

        </div>


        <div id="status">

            FBNeo • READY

        </div>

    </div>



    <footer>

        WEB ARCADE
        •
        Powered by EmulatorJS

    </footer>



<script>


    /* ==========================================
       ELEMENTS
    =========================================== */

    const menu =
        document.getElementById(
            "menu"
        );


    const gameSelect =
        document.getElementById(
            "game-select"
        );


    const uploadSection =
        document.getElementById(
            "upload-section"
        );


    const romUpload =
        document.getElementById(
            "rom-upload"
        );


    const playButton =
        document.getElementById(
            "play-button"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const gameWrapper =
        document.getElementById(
            "game-wrapper"
        );


    const gameFrame =
        document.getElementById(
            "emulator-frame"
        );


    const fullscreenButton =
        document.getElementById(
            "fullscreen-button"
        );


    const exitButton =
        document.getElementById(
            "exit-button"
        );


    const status =
        document.getElementById(
            "status"
        );


    /* ==========================================
       STATE
    =========================================== */

    let currentObjectUrl =
        null;


    let currentGameName =
        "";


    /* ==========================================
       ERROR
    =========================================== */

    function showError(
        message
    ) {

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            message;

    }


    function clearError() {

        errorBox.style.display =
            "none";

        errorBox.innerHTML =
            "";

    }


    /* ==========================================
       ROM SELECT
    =========================================== */

    gameSelect.addEventListener(
        "change",
        function () {

            clearError();


            if (
                gameSelect.value ===
                "upload"
            ) {

                uploadSection.style.display =
                    "block";

            } else {

                uploadSection.style.display =
                    "none";

                romUpload.value =
                    "";

            }

        }
    );


    /* ==========================================
       GET GAME URL
    ========================================== */

    function getGameUrl() {

        /*
         * =====================================
         * CUSTOM UPLOAD
         * =====================================
         */

        if (
            gameSelect.value ===
            "upload"
        ) {

            const file =
                romUpload.files[0];


            if (!file) {

                throw new Error(
                    "Pumili muna ng .ZIP ROM file."
                );

            }


            if (
                !file.name
                    .toLowerCase()
                    .endsWith(".zip")
            ) {

                throw new Error(
                    "ZIP ROM files only."
                );

            }


            /*
             * Remove previous object URL.
             */

            if (currentObjectUrl) {

                URL.revokeObjectURL(
                    currentObjectUrl
                );

            }


            /*
             * Create browser-local URL.
             */

            currentObjectUrl =
                URL.createObjectURL(
                    file
                );


            currentGameName =
                file.name;


            return currentObjectUrl;

        }


        /*
         * =====================================
         * GITHUB ROM
         * =====================================
         */

        const filename =
            gameSelect.value;


        currentGameName =
            filename;


        return new URL(
            "roms/" + filename,
            window.location.href
        ).href;

    }


    /* ==========================================
       CREATE EMULATOR PAGE
    =========================================== */

    function createEmulatorPage(
        gameUrl
    ) {

        /*
         * Escape strings safely for
         * JavaScript inside srcdoc.
         */

        const safeGameUrl =
            JSON.stringify(
                gameUrl
            );


        const safeGameName =
            JSON.stringify(
                currentGameName
            );


        /*
         * EmulatorJS page.
         *
         * EJS_core = arcade
         *
         * Arcade resolves to FBNeo.
         */

        return `
<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0"
    >

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

        }

        #game {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


    <div id="game"></div>


    <script>

        /*
         * =====================================
         * EMULATORJS SETTINGS
         * =====================================
         */

        var EJS_player =
            "#game";


        /*
         * "arcade" uses FBNeo.
         */

        var EJS_core =
            "arcade";


        /*
         * ROM.
         */

        var EJS_gameUrl =
            ${safeGameUrl};


        /*
         * Game title.
         */

        var EJS_gameName =
            ${safeGameName};


        /*
         * EmulatorJS CDN.
         */

        var EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";


        /*
         * Don't start until loaded.
         */

        var EJS_startOnLoaded =
            true;


        /*
         * Background.
         */

        var EJS_backgroundColor =
            "#000000";


        /*
         * UI accent.
         */

        var EJS_color =
            "#ff0055";


        /*
         * Prevent an additional
         * automatic fullscreen.
         */

        var EJS_fullscreenOnLoaded =
            false;


        /*
         * Arcade controls.
         */

        var EJS_controlScheme =
            "arcade";


    <\/script>


    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js"
    ><\/script>


</body>

</html>
`;

    }


    /* ==========================================
       START GAME
    =========================================== */

    function startGame() {

        clearError();


        try {

            playButton.disabled =
                true;


            playButton.innerText =
                "LOADING...";


            loading.style.display =
                "block";


            menu.style.display =
                "none";


            gameWrapper.style.display =
                "block";


            status.innerText =
                "FBNeo • LOADING";


            /*
             * Get ROM URL.
             */

            const gameUrl =
                getGameUrl();


            console.log(
                "WEB ARCADE"
            );


            console.log(
                "Core: FBNeo"
            );


            console.log(
                "ROM:",
                gameUrl
            );


            /*
             * Reset iframe.
             */

            gameFrame.src =
                "about:blank";


            /*
             * Wait a little so the iframe
             * fully resets.
             */

            setTimeout(
                function () {

                    gameFrame.srcdoc =
                        createEmulatorPage(
                            gameUrl
                        );

                },
                100
            );


            /*
             * Loading message.
             */

            setTimeout(
                function () {

                    loading.style.display =
                        "none";


                    status.innerText =
                        "FBNeo • GAME LOADING";

                },
                1500
            );


        } catch (error) {

            console.error(
                error
            );


            loading.style.display =
                "none";


            menu.style.display =
                "flex";


            gameWrapper.style.display =
                "none";


            showError(

                "EMULATOR ERROR:<br><br>" +

                (
                    error.message ||
                    String(error)
                )

            );

        } finally {

            playButton.disabled =
                false;

            playButton.innerText =
                "▶ PLAY START";

        }

    }


    /* ==========================================
       FULLSCREEN
    =========================================== */

    fullscreenButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await gameWrapper.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

            }

        }
    );


    /* ==========================================
       EXIT GAME
    =========================================== */

    exitButton.addEventListener(
        "click",
        function () {

            /*
             * Remove object URL.
             */

            if (currentObjectUrl) {

                URL.revokeObjectURL(
                    currentObjectUrl
                );

                currentObjectUrl =
                    null;

            }


            /*
             * Stop iframe.
             */

            gameFrame.srcdoc =
                "";

            gameFrame.src =
                "about:blank";


            /*
             * Reset UI.
             */

            gameWrapper.style.display =
                "none";


            loading.style.display =
                "none";


            menu.style.display =
                "flex";


            status.innerText =
                "FBNeo • READY";


            currentGameName =
                "";


            clearError();

        }
    );


    /* ==========================================
       PLAY
    =========================================== */

    playButton.addEventListener(
        "click",
        startGame
    );


    /* ==========================================
       CLEANUP
    =========================================== */

    window.addEventListener(
        "beforeunload",
        function () {

            if (currentObjectUrl) {

                URL.revokeObjectURL(
                    currentObjectUrl
                );

            }

        }
    );


</script>

</body>

</html>
