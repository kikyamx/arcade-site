<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WEB ARCADE - MAME / FBNeo</title>

    <!-- =========================================
         NOSTALGIST.JS
         Official CDN
    ========================================== -->

    <script src="https://unpkg.com/nostalgist"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

        }


        body {

            background:
                radial-gradient(
                    circle at top,
                    #11112b 0%,
                    #050510 45%,
                    #000000 100%
                );

            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            min-height: 100vh;

            overflow-x: hidden;

        }


        /* =========================================
           HEADER
        ========================================== */

        .header {

            width: 100%;

            text-align: center;

            padding:
                30px
                15px
                10px;

        }


        h1 {

            margin: 0;

            color: #ff0055;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    3.5rem
                );

            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;

        }


        .subtitle {

            margin-top: 8px;

            color: #00ffcc;

            font-size: 1rem;

            font-weight: bold;

            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc;

        }


        /* =========================================
           MENU
        ========================================== */

        .menu-container {

            width:
                calc(100% - 30px);

            max-width: 650px;

            margin:
                25px 15px;

            padding: 22px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.88
                );

            border:
                2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.2
                );

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        label {

            color: #00ffcc;

            font-weight: bold;

            font-size: 16px;

        }


        select,
        input[type="file"] {

            width: 100%;

            padding: 12px;

            background: #111;

            color: white;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            outline: none;

            font-family: inherit;

            font-size: 16px;

        }


        select:focus,
        input[type="file"]:focus {

            border-color: #00ffcc;

            box-shadow:
                0 0 8px #00ffcc;

        }


        option {

            background: #111;

            color: white;

        }


        /* =========================================
           UPLOAD
        ========================================== */

        .upload-section {

            display: none;

            padding: 15px;

            border:
                1px dashed #ffcc00;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    204,
                    0,
                    0.03
                );

        }


        .upload-section label {

            color: #ffcc00;

        }


        /* =========================================
           BUTTON
        ========================================== */

        button {

            width: 100%;

            padding: 14px;

            background: transparent;

            color: #ff0055;

            border:
                2px solid #ff0055;

            border-radius: 5px;

            cursor: pointer;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            text-transform: uppercase;

            box-shadow:
                0 0 10px
                #ff0055 inset,
                0 0 10px
                #ff0055;

            transition:
                0.2s;

        }


        button:hover {

            background: #ff0055;

            color: white;

        }


        button:disabled {

            opacity: 0.5;

            cursor: wait;

        }


        /* =========================================
           LOADING
        ========================================== */

        #loading {

            display: none;

            margin: 20px;

            color: #ffcc00;

            text-align: center;

            font-size: 17px;

            font-weight: bold;

            text-shadow:
                0 0 5px #ffcc00;

        }


        /* =========================================
           ERROR
        ========================================== */

        #error-div {

            display: none;

            color: #ff0055;

            border:
                1px solid #ff0055;

            background:
                rgba(
                    255,
                    0,
                    85,
                    0.08
                );

            padding: 12px;

            border-radius: 5px;

            text-align: center;

            line-height: 1.5;

            font-weight: bold;

        }


        /* =========================================
           GAME
        ========================================== */

        #game-wrapper {

            display: none;

            width: 100%;

            max-width: 1000px;

            padding:
                10px
                15px
                30px;

        }


        #game-container {

            width: 100%;

            aspect-ratio: 4 / 3;

            min-height: 300px;

            background: #000;

            border:
                2px solid #00ffcc;

            border-radius: 8px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.25
                );

        }


        #game-container canvas {

            display: block;

            max-width: 100%;

            max-height: 100%;

            image-rendering: pixelated;

        }


        /* =========================================
           CONTROLS
        ========================================== */

        .game-controls {

            display: flex;

            gap: 10px;

            margin-top: 12px;

        }


        .game-controls button {

            flex: 1;

            font-size: 14px;

            padding: 10px;

        }


        .restart {

            color: #ffcc00;

            border-color: #ffcc00;

            box-shadow:
                0 0 10px
                #ffcc00 inset,
                0 0 10px
                #ffcc00;

        }


        .restart:hover {

            background: #ffcc00;

            color: #000;

        }


        .fullscreen {

            color: #00ffcc;

            border-color: #00ffcc;

            box-shadow:
                0 0 10px
                #00ffcc inset,
                0 0 10px
                #00ffcc;

        }


        .fullscreen:hover {

            background: #00ffcc;

            color: #000;

        }


        /* =========================================
           STATUS
        ========================================== */

        #status {

            margin-top: 10px;

            text-align: center;

            color: #777;

            font-size: 12px;

        }


        /* =========================================
           FOOTER
        ========================================== */

        footer {

            margin-top: auto;

            padding: 20px;

            color: #555;

            font-size: 11px;

            text-align: center;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .menu-container {

                padding: 18px;

            }


            #game-container {

                min-height: 240px;

            }


            .game-controls {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

        <h1>
            WEB ARCADE
        </h1>

        <div class="subtitle">
            MAME / FBNEO EMULATOR
        </div>

    </div>



    <!-- =========================================
         MENU
    ========================================== -->

    <div
        class="menu-container"
        id="menu"
    >

        <label for="game-select">
            SELECT A GAME
        </label>


        <select id="game-select">

            <option value="ddsomur1.zip">
                Dungeons & Dragons:
                Shadow over Mystara
            </option>

            <option value="upload">
                -- UPLOAD CUSTOM ROM --
            </option>

        </select>


        <!-- CUSTOM ROM -->

        <div
            class="upload-section"
            id="upload-section"
        >

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br>
            <br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <!-- PLAY -->

        <button id="play-button">
            ▶ PLAY START
        </button>


        <!-- ERROR -->

        <div id="error-div"></div>

    </div>



    <!-- =========================================
         LOADING
    ========================================== -->

    <div id="loading">

        ⏳ LOADING EMULATOR...

        <br><br>

        Please wait...

    </div>



    <!-- =========================================
         GAME
    ========================================== -->

    <div id="game-wrapper">

        <div id="game-container"></div>


        <div class="game-controls">

            <button
                class="restart"
                id="restart-button"
            >
                ↻ RESTART
            </button>


            <button
                class="fullscreen"
                id="fullscreen-button"
            >
                ⛶ FULLSCREEN
            </button>


            <button
                id="exit-button"
            >
                ✕ EXIT
            </button>

        </div>


        <div id="status">
            FBNeo Emulator
        </div>

    </div>



    <footer>

        WEB ARCADE
        •
        Powered by Nostalgist.js

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        let nostalgistInstance = null;

        let currentRom = null;


        /* =========================================
           ELEMENTS
        ========================================= */

        const menu =
            document.getElementById(
                "menu"
            );

        const gameSelect =
            document.getElementById(
                "game-select"
            );

        const uploadSection =
            document.getElementById(
                "upload-section"
            );

        const romUpload =
            document.getElementById(
                "rom-upload"
            );

        const playButton =
            document.getElementById(
                "play-button"
            );

        const restartButton =
            document.getElementById(
                "restart-button"
            );

        const fullscreenButton =
            document.getElementById(
                "fullscreen-button"
            );

        const exitButton =
            document.getElementById(
                "exit-button"
            );

        const gameWrapper =
            document.getElementById(
                "game-wrapper"
            );

        const gameContainer =
            document.getElementById(
                "game-container"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const errorDiv =
            document.getElementById(
                "error-div"
            );

        const status =
            document.getElementById(
                "status"
            );



        /* =========================================
           UPLOAD TOGGLE
        ========================================== */

        gameSelect.addEventListener(
            "change",
            function () {

                clearError();

                if (
                    gameSelect.value ===
                    "upload"
                ) {

                    uploadSection.style.display =
                        "block";

                } else {

                    uploadSection.style.display =
                        "none";

                    romUpload.value = "";

                }

            }
        );



        /* =========================================
           ERROR
        ========================================== */

        function showError(
            message
        ) {

            errorDiv.style.display =
                "block";

            errorDiv.innerHTML =
                message;

        }


        function clearError() {

            errorDiv.style.display =
                "none";

            errorDiv.innerHTML =
                "";

        }



        /* =========================================
           STOP GAME
        ========================================== */

        async function stopGame() {

            if (
                !nostalgistInstance
            ) {

                return;

            }


            try {

                nostalgistInstance.exit({
                    removeCanvas: true
                });

            } catch (error) {

                console.warn(
                    "Exit warning:",
                    error
                );

            }


            nostalgistInstance =
                null;


            gameContainer.innerHTML =
                "";

        }



        /* =========================================
           GET ROM
        ========================================== */

        function getRom() {

            /*
             * CUSTOM UPLOAD
             */

            if (
                gameSelect.value ===
                "upload"
            ) {

                const file =
                    romUpload.files[0];


                if (!file) {

                    throw new Error(
                        "Pumili muna ng ROM .ZIP file."
                    );

                }


                return file;

            }


            /*
             * GITHUB ROM
             */

            return gameSelect.value;

        }



        /* =========================================
           START GAME
        ========================================== */

        async function startGame() {

            clearError();


            /*
             * CHECK LIBRARY
             */

            if (
                typeof Nostalgist ===
                "undefined"
            ) {

                showError(
                    "Nostalgist.js failed to load.<br><br>" +

                    "Please check your internet connection " +
                    "or refresh the page."
                );

                console.error(
                    "Nostalgist is undefined."
                );

                return;

            }


            try {

                playButton.disabled =
                    true;

                playButton.innerText =
                    "LOADING...";


                loading.style.display =
                    "block";


                menu.style.display =
                    "none";


                gameWrapper.style.display =
                    "block";


                /*
                 * Stop old emulator
                 */

                await stopGame();


                /*
                 * Get ROM
                 */

                const rom =
                    getRom();


                currentRom =
                    rom;


                /*
                 * Launch
                 */

                console.log(
                    "Launching FBNeo..."
                );

                console.log(
                    "ROM:",
                    rom
                );


                nostalgistInstance =
                    await Nostalgist.launch({

                        core: "fbneo",

                        rom: rom,

                        element:
                            gameContainer,

                        cache: true,


                        /*
                         * GitHub Pages ROM resolver
                         */

                        resolveRom(
                            file
                        ) {

                            const url =
                                "./roms/" +
                                file;

                            console.log(
                                "Loading ROM:",
                                url
                            );

                            return url;

                        }

                    });


                /*
                 * SUCCESS
                 */

                loading.style.display =
                    "none";


                status.innerText =
                    "FBNeo • GAME RUNNING";


                console.log(
                    "Game started successfully."
                );


            } catch (error) {

                console.error(
                    "EMULATOR ERROR:",
                    error
                );


                loading.style.display =
                    "none";


                gameWrapper.style.display =
                    "none";


                menu.style.display =
                    "flex";


                showError(

                    "FATAL ERROR:<br><br>" +

                    (
                        error.message ||
                        error
                    ) +

                    "<br><br>" +

                    "Open F12 → Console " +
                    "for additional details."

                );

            } finally {

                playButton.disabled =
                    false;

                playButton.innerText =
                    "▶ PLAY START";

            }

        }



        /* =========================================
           RESTART
        ========================================== */

        async function restartGame() {

            if (!currentRom) {

                return;

            }


            clearError();


            loading.style.display =
                "block";


            try {

                await stopGame();


                nostalgistInstance =
                    await Nostalgist.launch({

                        core: "fbneo",

                        rom: currentRom,

                        element:
                            gameContainer,

                        cache: true,


                        resolveRom(
                            file
                        ) {

                            return (
                                "./roms/" +
                                file
                            );

                        }

                    });


                loading.style.display =
                    "none";


                status.innerText =
                    "FBNeo • GAME RESTARTED";


            } catch (error) {

                loading.style.display =
                    "none";


                console.error(
                    error
                );


                showError(
                    "RESTART ERROR:<br><br>" +
                    error.message
                );

            }

        }



        /* =========================================
           FULLSCREEN
        ========================================== */

        async function fullscreenGame() {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await gameWrapper.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

            }

        }



        /* =========================================
           EXIT GAME
        ========================================== */

        async function exitGame() {

            await stopGame();


            gameWrapper.style.display =
                "none";


            loading.style.display =
                "none";


            menu.style.display =
                "flex";


            currentRom =
                null;


            status.innerText =
                "FBNeo Emulator";


            clearError();

        }



        /* =========================================
           EVENTS
        ========================================== */

        playButton.addEventListener(
            "click",
            startGame
        );


        restartButton.addEventListener(
            "click",
            restartGame
        );


        fullscreenButton.addEventListener(
            "click",
            fullscreenGame
        );


        exitButton.addEventListener(
            "click",
            exitGame
        );



        /* =========================================
           PAGE LOAD CHECK
        ========================================== */

        window.addEventListener(
            "load",
            function () {

                console.log(
                    "=============================="
                );

                console.log(
                    "WEB ARCADE"
                );

                console.log(
                    "Nostalgist loaded:",
                    typeof Nostalgist !==
                        "undefined"
                );

                console.log(
                    "=============================="
                );

            }
        );

    </script>

</body>

</html>
