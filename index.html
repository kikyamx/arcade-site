<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WEB ARCADE - FBNeo</title>

    <!-- =========================================
         NOSTALGIST.JS
    ========================================== -->
    <script src="https://unpkg.com/nostalgist"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    #14142f 0%,
                    #070714 45%,
                    #000000 100%
                );

            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow-x: hidden;
        }

        /* =========================================
           HEADER
        ========================================== */

        .header {
            width: 100%;
            text-align: center;

            padding:
                30px 15px 10px;
        }

        h1 {
            margin: 0;

            color: #ff0055;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    3.5rem
                );

            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
        }

        .subtitle {
            margin-top: 8px;

            color: #00ffcc;

            font-weight: bold;

            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc;
        }

        /* =========================================
           MENU
        ========================================== */

        #menu {
            width:
                calc(100% - 30px);

            max-width: 650px;

            margin:
                25px 15px;

            padding: 24px;

            background:
                rgba(0, 0, 0, 0.88);

            border:
                2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px rgba(
                    0,
                    255,
                    204,
                    0.20
                );

            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        label {
            color: #00ffcc;

            font-size: 16px;
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;

            padding: 12px;

            background: #111;

            color: #fff;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            outline: none;

            font-family: inherit;
            font-size: 16px;
        }

        select:focus,
        input[type="file"]:focus {
            border-color: #00ffcc;

            box-shadow:
                0 0 8px #00ffcc;
        }

        option {
            background: #111;
            color: #fff;
        }

        /* =========================================
           UPLOAD SECTION
        ========================================== */

        #upload-section {
            display: none;

            padding: 15px;

            border:
                1px dashed #ffcc00;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    204,
                    0,
                    0.03
                );
        }

        #upload-section label {
            color: #ffcc00;
        }

        /* =========================================
           BUTTON
        ========================================== */

        button {
            width: 100%;

            padding: 14px;

            background: transparent;

            color: #ff0055;

            border:
                2px solid #ff0055;

            border-radius: 5px;

            cursor: pointer;

            font-family: inherit;

            font-size: 18px;
            font-weight: bold;

            text-transform: uppercase;

            box-shadow:
                0 0 10px #ff0055 inset,
                0 0 10px #ff0055;

            transition: 0.2s;
        }

        button:hover {
            background: #ff0055;
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* =========================================
           ERROR
        ========================================== */

        #error {
            display: none;

            padding: 14px;

            color: #ff0055;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    0,
                    85,
                    0.08
                );

            text-align: center;

            line-height: 1.5;

            font-weight: bold;

            word-break: break-word;
        }

        /* =========================================
           LOADING
        ========================================== */

        #loading {
            display: none;

            margin: 20px;

            color: #ffcc00;

            font-size: 17px;
            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 5px #ffcc00;
        }

        /* =========================================
           GAME WRAPPER
        ========================================== */

        #game-wrapper {
            display: none;

            width: 100%;
            max-width: 1100px;

            padding:
                10px 15px 30px;
        }

        /* =========================================
           GAME CONTAINER
        ========================================== */

        #game-container {
            width: 100%;

            aspect-ratio: 4 / 3;

            min-height: 300px;

            background: #000;

            border:
                2px solid #00ffcc;

            border-radius: 8px;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px rgba(
                    0,
                    255,
                    204,
                    0.25
                );
        }

        /*
         * Nostalgist creates the canvas automatically.
         * This styles any canvas it creates.
         */

        #game-container canvas {
            display: block;

            width: 100% !important;
            height: 100% !important;

            max-width: 100%;
            max-height: 100%;

            background: #000;

            image-rendering: pixelated;
        }

        /* =========================================
           GAME CONTROLS
        ========================================== */

        .controls {
            display: flex;

            gap: 10px;

            margin-top: 12px;
        }

        .controls button {
            flex: 1;

            padding: 10px;

            font-size: 14px;
        }

        .restart {
            color: #ffcc00;

            border-color: #ffcc00;

            box-shadow:
                0 0 10px #ffcc00 inset,
                0 0 10px #ffcc00;
        }

        .restart:hover {
            background: #ffcc00;
            color: #000;
        }

        .fullscreen {
            color: #00ffcc;

            border-color: #00ffcc;

            box-shadow:
                0 0 10px #00ffcc inset,
                0 0 10px #00ffcc;
        }

        .fullscreen:hover {
            background: #00ffcc;
            color: #000;
        }

        /* =========================================
           STATUS
        ========================================== */

        #status {
            margin-top: 10px;

            color: #777;

            text-align: center;

            font-size: 12px;
        }

        /* =========================================
           FOOTER
        ========================================== */

        footer {
            margin-top: auto;

            padding: 20px;

            color: #555;

            font-size: 11px;

            text-align: center;
        }

        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {
            #menu {
                padding: 18px;
            }

            #game-container {
                min-height: 240px;
            }

            .controls {
                flex-direction: column;
            }
        }

        /* =========================================
           FULLSCREEN
        ========================================== */

        #game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;

            max-width: none;

            padding: 0;

            background: #000;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }

        #game-wrapper:fullscreen #game-container {
            width: 100vw;
            height: 100vh;

            max-width: none;

            aspect-ratio: auto;

            border: none;

            border-radius: 0;

            box-shadow: none;
        }

        #game-wrapper:fullscreen .controls {
            position: absolute;

            left: 20px;
            right: 20px;
            bottom: 15px;

            z-index: 20;
        }
    </style>

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

        <h1>
            WEB ARCADE
        </h1>

        <div class="subtitle">
            MAME / FBNEO EMULATOR
        </div>

    </div>


    <!-- =========================================
         MENU
    ========================================== -->

    <div id="menu">

        <label for="game-select">
            SELECT A GAME
        </label>


        <select id="game-select">

            <option value="ddsomur1.zip">
                Dungeons & Dragons:
                Shadow over Mystara
            </option>

            <option value="upload">
                -- UPLOAD CUSTOM ROM --
            </option>

        </select>


        <div id="upload-section">

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br><br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <button id="play-button">
            ▶ PLAY START
        </button>


        <div id="error"></div>

    </div>


    <!-- =========================================
         LOADING
    ========================================== -->

    <div id="loading">

        ⏳ LOADING FBNEO...

        <br><br>

        Please wait...

    </div>


    <!-- =========================================
         GAME
    ========================================== -->

    <div id="game-wrapper">

        <div id="game-container"></div>


        <div class="controls">

            <button
                class="restart"
                id="restart-button"
            >
                ↻ RESTART
            </button>


            <button
                class="fullscreen"
                id="fullscreen-button"
            >
                ⛶ FULLSCREEN
            </button>


            <button
                id="exit-button"
            >
                ✕ EXIT
            </button>

        </div>


        <div id="status">
            FBNeo • Ready
        </div>

    </div>


    <footer>
        WEB ARCADE • Powered by Nostalgist.js
    </footer>


<script>

    /* =========================================
       GLOBAL STATE
    ========================================== */

    let emulator = null;

    let currentRom = null;

    let currentRomIsFile = false;


    /* =========================================
       ELEMENTS
    ========================================== */

    const menu =
        document.getElementById("menu");

    const gameSelect =
        document.getElementById("game-select");

    const uploadSection =
        document.getElementById("upload-section");

    const romUpload =
        document.getElementById("rom-upload");

    const playButton =
        document.getElementById("play-button");

    const restartButton =
        document.getElementById("restart-button");

    const fullscreenButton =
        document.getElementById("fullscreen-button");

    const exitButton =
        document.getElementById("exit-button");

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const gameWrapper =
        document.getElementById("game-wrapper");

    const gameContainer =
        document.getElementById("game-container");

    const status =
        document.getElementById("status");


    /* =========================================
       LIBRARY CHECK
    ========================================== */

    console.log("================================");
    console.log("WEB ARCADE");
    console.log("================================");

    console.log(
        "Nostalgist:",
        typeof Nostalgist
    );


    window.addEventListener(
        "load",
        function () {

            console.log(
                "Nostalgist after page load:",
                typeof Nostalgist
            );

        }
    );


    /* =========================================
       ERROR FUNCTIONS
    ========================================== */

    function showError(message) {

        errorBox.style.display = "block";

        errorBox.innerHTML = message;

    }


    function clearError() {

        errorBox.style.display = "none";

        errorBox.innerHTML = "";

    }


    /* =========================================
       UPLOAD TOGGLE
    ========================================== */

    gameSelect.addEventListener(
        "change",
        function () {

            clearError();


            if (
                gameSelect.value === "upload"
            ) {

                uploadSection.style.display =
                    "block";

            } else {

                uploadSection.style.display =
                    "none";

                romUpload.value = "";

            }

        }
    );


    /* =========================================
       CLEAN GAME CANVAS
    ========================================== */

    function clearGameContainer() {

        const canvases =
            gameContainer.querySelectorAll(
                "canvas"
            );


        canvases.forEach(
            canvas => {
                canvas.remove();
            }
        );

    }


    /* =========================================
       STOP EMULATOR
    ========================================== */

    async function stopEmulator() {

        if (!emulator) {

            clearGameContainer();

            return;

        }


        try {

            emulator.exit({
                removeCanvas: true
            });

        } catch (error) {

            console.warn(
                "Emulator exit warning:",
                error
            );

        }


        emulator = null;


        /*
         * Remove any canvas Nostalgist
         * may have created.
         */

        clearGameContainer();

    }


    /* =========================================
       GET ROM
    ========================================== */

    function getRom() {

        /*
         * CUSTOM UPLOAD
         */

        if (
            gameSelect.value === "upload"
        ) {

            const file =
                romUpload.files[0];


            if (!file) {

                throw new Error(
                    "Pumili muna ng ROM ZIP file."
                );

            }


            if (
                !file.name
                    .toLowerCase()
                    .endsWith(".zip")
            ) {

                throw new Error(
                    "ZIP file lamang ang supported."
                );

            }


            currentRomIsFile = true;

            return file;

        }


        /*
         * GITHUB PAGES ROM
         *
         * Example:
         *
         * https://kikyamx.github.io/arcade-site/roms/ddsomur1.zip
         *
         * Using an absolute URL means Nostalgist
         * doesn't need a custom resolveRom function.
         */

        const filename =
            gameSelect.value;


        const url =
            new URL(
                "roms/" + filename,
                window.location.href
            ).href;


        currentRomIsFile = false;


        return url;

    }


    /* =========================================
       GET CURRENT ROM AGAIN
    ========================================== */

    function getCurrentRom() {

        /*
         * Uploaded File object can be reused.
         */

        if (currentRomIsFile) {

            return currentRom;

        }


        /*
         * For GitHub ROM, rebuild absolute URL.
         */

        return new URL(
            "roms/" + gameSelect.value,
            window.location.href
        ).href;

    }


    /* =========================================
       MOVE NOSTALGIST CANVAS
    ========================================== */

    function attachCanvasToGame() {

        /*
         * Nostalgist creates its canvas automatically
         * and appends it to document.body.
         *
         * We find that canvas and move it to
         * our game-container.
         */

        let canvas =
            null;


        /*
         * First try the instance API.
         */

        if (
            emulator &&
            typeof emulator.getCanvas === "function"
        ) {

            try {

                canvas =
                    emulator.getCanvas();

            } catch (error) {

                console.warn(
                    "getCanvas warning:",
                    error
                );

            }

        }


        /*
         * Fallback:
         * Search all canvases on the page.
         */

        if (!canvas) {

            const canvases =
                document.querySelectorAll(
                    "canvas"
                );


            if (
                canvases.length > 0
            ) {

                canvas =
                    canvases[
                        canvases.length - 1
                    ];

            }

        }


        if (!canvas) {

            throw new Error(
                "Emulator started, but no canvas was created."
            );

        }


        /*
         * Remove from previous parent if required.
         */

        if (
            canvas.parentElement !==
            gameContainer
        ) {

            gameContainer.appendChild(
                canvas
            );

        }


        /*
         * Style canvas.
         */

        canvas.style.display =
            "block";

        canvas.style.width =
            "100%";

        canvas.style.height =
            "100%";

        canvas.style.maxWidth =
            "100%";

        canvas.style.maxHeight =
            "100%";

        canvas.style.background =
            "#000";


        /*
         * Give keyboard focus.
         */

        try {

            canvas.tabIndex = 0;

            canvas.focus();

        } catch (error) {

            console.warn(
                "Canvas focus warning:",
                error
            );

        }


        return canvas;

    }


    /* =========================================
       LAUNCH EMULATOR
    ========================================== */

    async function launchGame(
        rom
    ) {

        /*
         * IMPORTANT:
         *
         * NO "element" OPTION.
         *
         * NO manual core URL.
         *
         * Nostalgist will:
         *
         * 1. Load FBNeo
         * 2. Create its own canvas
         * 3. Load ROM
         *
         */


        console.log(
            "Launching FBNeo..."
        );


        console.log(
            "ROM:",
            rom
        );


        emulator =
            await Nostalgist.launch({

                /*
                 * FBNeo
                 *
                 * Current Nostalgist supports
                 * FBNeo through its core resolver.
                 */

                core: "fbneo",


                /*
                 * ROM
                 */

                rom: rom,


                /*
                 * RetroArch configuration.
                 */

                retroarchConfig: {

                    video_windowed_fullscreen:
                        "false",

                    input_joypad_driver:
                        "emscripten"

                },

                /*
                 * Global keyboard events
                 */

                respondToGlobalEvents:
                    true

            });


        console.log(
            "Nostalgist launch completed."
        );


        /*
         * Attach generated canvas.
         */

        attachCanvasToGame();


        /*
         * Update status.
         */

        status.innerText =
            "FBNeo • GAME RUNNING";


        console.log(
            "FBNeo game launched successfully."
        );

    }


    /* =========================================
       START GAME
    ========================================== */

    async function startGame() {

        clearError();


        /*
         * Verify Nostalgist.
         */

        if (
            typeof Nostalgist === "undefined"
        ) {

            showError(
                "Nostalgist.js was not loaded.<br><br>" +
                "Refresh the page and try again."
            );

            return;

        }


        try {

            playButton.disabled =
                true;

            playButton.innerText =
                "LOADING...";


            loading.style.display =
                "block";


            menu.style.display =
                "none";


            gameWrapper.style.display =
                "block";


            /*
             * Stop old emulator.
             */

            await stopEmulator();


            /*
             * Get ROM.
             */

            const rom =
                getRom();


            currentRom =
                rom;


            /*
             * Launch.
             */

            await launchGame(
                rom
            );


            /*
             * Finished.
             */

            loading.style.display =
                "none";


        } catch (error) {

            console.error(
                "================================"
            );

            console.error(
                "FBNEO ERROR:",
                error
            );

            console.error(
                "================================"
            );


            loading.style.display =
                "none";


            gameWrapper.style.display =
                "none";


            menu.style.display =
                "flex";


            showError(

                "EMULATOR ERROR:<br><br>" +

                (
                    error.message ||
                    String(error)
                )

            );

        } finally {

            playButton.disabled =
                false;

            playButton.innerText =
                "▶ PLAY START";

        }

    }


    /* =========================================
       RESTART GAME
    ========================================== */

    restartButton.addEventListener(
        "click",
        async function () {

            clearError();


            if (!currentRom) {

                return;

            }


            try {

                loading.style.display =
                    "block";


                const rom =
                    getCurrentRom();


                await stopEmulator();


                await launchGame(
                    rom
                );


                loading.style.display =
                    "none";


                status.innerText =
                    "FBNeo • RESTARTED";


            } catch (error) {

                loading.style.display =
                    "none";


                console.error(
                    "Restart error:",
                    error
                );


                showError(
                    "RESTART ERROR:<br><br>" +
                    (
                        error.message ||
                        String(error)
                    )
                );

            }

        }
    );


    /* =========================================
       FULLSCREEN
    ========================================== */

    fullscreenButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await gameWrapper.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

            }

        }
    );


    /* =========================================
       EXIT GAME
    ========================================== */

    exitButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.warn(
                    "Fullscreen exit warning:",
                    error
                );

            }


            await stopEmulator();


            gameWrapper.style.display =
                "none";


            loading.style.display =
                "none";


            menu.style.display =
                "flex";


            currentRom =
                null;

            currentRomIsFile =
                false;


            status.innerText =
                "FBNeo • Ready";


            clearError();

        }
    );


    /* =========================================
       PLAY BUTTON
    ========================================== */

    playButton.addEventListener(
        "click",
        startGame
    );


    /* =========================================
       KEYBOARD
    ========================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            /*
             * F11
             */

            if (
                event.key === "F11"
            ) {

                event.preventDefault();

                fullscreenButton.click();

            }

        }
    );


</script>

</body>
</html>
