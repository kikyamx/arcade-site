<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WEB ARCADE - FBNeo</title>


    <!-- ==========================================
         NOSTALGIST.JS
    =========================================== -->

    <script src="https://unpkg.com/nostalgist"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

        }


        body {

            background:
                radial-gradient(
                    circle at top,
                    #12122c 0%,
                    #050510 45%,
                    #000000 100%
                );

            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            overflow-x: hidden;

        }


        /* ==========================================
           HEADER
        =========================================== */

        .header {

            width: 100%;

            text-align: center;

            padding:
                30px
                15px
                10px;

        }


        h1 {

            margin: 0;

            color: #ff0055;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    3.5rem
                );

            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;

        }


        .subtitle {

            margin-top: 8px;

            color: #00ffcc;

            font-size: 16px;

            font-weight: bold;

            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc;

        }


        /* ==========================================
           MENU
        =========================================== */

        #menu {

            width:
                calc(100% - 30px);

            max-width: 650px;

            margin:
                25px 15px;

            padding: 24px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.88
                );

            border:
                2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.20
                );

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        label {

            color: #00ffcc;

            font-weight: bold;

            font-size: 16px;

        }


        select,
        input[type="file"] {

            width: 100%;

            padding: 12px;

            background: #111;

            color: white;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            outline: none;

            font-family: inherit;

            font-size: 16px;

        }


        select:focus,
        input[type="file"]:focus {

            border-color: #00ffcc;

            box-shadow:
                0 0 8px #00ffcc;

        }


        option {

            background: #111;

            color: white;

        }


        /* ==========================================
           UPLOAD
        =========================================== */

        #upload-section {

            display: none;

            padding: 15px;

            border:
                1px dashed #ffcc00;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    204,
                    0,
                    0.03
                );

        }


        #upload-section label {

            color: #ffcc00;

        }


        /* ==========================================
           PLAY BUTTON
        =========================================== */

        button {

            width: 100%;

            padding: 14px;

            background: transparent;

            color: #ff0055;

            border:
                2px solid #ff0055;

            border-radius: 5px;

            cursor: pointer;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            text-transform: uppercase;

            box-shadow:
                0 0 10px #ff0055 inset,
                0 0 10px #ff0055;

            transition:
                0.2s;

        }


        button:hover {

            background: #ff0055;

            color: white;

        }


        button:disabled {

            opacity: 0.5;

            cursor: wait;

        }


        /* ==========================================
           ERROR
        =========================================== */

        #error {

            display: none;

            padding: 14px;

            color: #ff0055;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    0,
                    85,
                    0.08
                );

            text-align: center;

            line-height: 1.5;

            font-weight: bold;

        }


        /* ==========================================
           LOADING
        =========================================== */

        #loading {

            display: none;

            margin: 20px;

            color: #ffcc00;

            font-size: 17px;

            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 5px #ffcc00;

        }


        /* ==========================================
           GAME AREA
        =========================================== */

        #game-wrapper {

            display: none;

            width: 100%;

            max-width: 1000px;

            padding:
                10px
                15px
                30px;

        }


        #game-container {

            width: 100%;

            aspect-ratio: 4 / 3;

            min-height: 300px;

            background: #000;

            border:
                2px solid #00ffcc;

            border-radius: 8px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.25
                );

        }


        /*
         * Nostalgist will create the canvas.
         * We move/style it after launch.
         */

        #game-container canvas {

            width: 100% !important;

            height: 100% !important;

            max-width: 100%;

            max-height: 100%;

            display: block;

            image-rendering: pixelated;

            background: #000;

        }


        /* ==========================================
           CONTROLS
        =========================================== */

        .controls {

            display: flex;

            gap: 10px;

            margin-top: 12px;

        }


        .controls button {

            flex: 1;

            font-size: 14px;

            padding: 10px;

        }


        .restart {

            color: #ffcc00;

            border-color: #ffcc00;

            box-shadow:
                0 0 10px
                #ffcc00 inset,
                0 0 10px
                #ffcc00;

        }


        .restart:hover {

            background: #ffcc00;

            color: #000;

        }


        .fullscreen {

            color: #00ffcc;

            border-color: #00ffcc;

            box-shadow:
                0 0 10px
                #00ffcc inset,
                0 0 10px
                #00ffcc;

        }


        .fullscreen:hover {

            background: #00ffcc;

            color: #000;

        }


        /* ==========================================
           STATUS
        =========================================== */

        #status {

            margin-top: 10px;

            color: #777;

            text-align: center;

            font-size: 12px;

        }


        /* ==========================================
           FOOTER
        =========================================== */

        footer {

            margin-top: auto;

            padding: 20px;

            color: #555;

            font-size: 11px;

            text-align: center;

        }


        /* ==========================================
           MOBILE
        =========================================== */

        @media (max-width: 600px) {

            #menu {

                padding: 18px;

            }


            #game-container {

                min-height: 240px;

            }


            .controls {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <div class="header">

        <h1>
            WEB ARCADE
        </h1>

        <div class="subtitle">
            MAME / FBNEO EMULATOR
        </div>

    </div>



    <!-- ==========================================
         MENU
    =========================================== -->

    <div id="menu">

        <label>
            SELECT A GAME
        </label>


        <select id="game-select">

            <option value="ddsomur1.zip">

                Dungeons & Dragons:
                Shadow over Mystara

            </option>


            <option value="upload">

                -- UPLOAD CUSTOM ROM --

            </option>

        </select>


        <div id="upload-section">

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br>
            <br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <button id="play-button">

            ▶ PLAY START

        </button>


        <div id="error"></div>

    </div>



    <!-- ==========================================
         LOADING
    =========================================== -->

    <div id="loading">

        ⏳ LOADING FBNEO...

        <br><br>

        Please wait...

    </div>



    <!-- ==========================================
         GAME
    =========================================== -->

    <div id="game-wrapper">

        <div id="game-container"></div>


        <div class="controls">

            <button
                class="restart"
                id="restart-button"
            >
                ↻ RESTART
            </button>


            <button
                class="fullscreen"
                id="fullscreen-button"
            >
                ⛶ FULLSCREEN
            </button>


            <button
                id="exit-button"
            >
                ✕ EXIT
            </button>

        </div>


        <div id="status">

            FBNeo • Ready

        </div>

    </div>



    <footer>

        WEB ARCADE
        •
        Powered by Nostalgist.js

    </footer>



<script>


    /* ==========================================
       VARIABLES
    =========================================== */

    let emulator = null;

    let currentRom = null;



    /* ==========================================
       ELEMENTS
    =========================================== */

    const menu =
        document.getElementById(
            "menu"
        );


    const gameSelect =
        document.getElementById(
            "game-select"
        );


    const uploadSection =
        document.getElementById(
            "upload-section"
        );


    const romUpload =
        document.getElementById(
            "rom-upload"
        );


    const playButton =
        document.getElementById(
            "play-button"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const gameWrapper =
        document.getElementById(
            "game-wrapper"
        );


    const gameContainer =
        document.getElementById(
            "game-container"
        );


    const restartButton =
        document.getElementById(
            "restart-button"
        );


    const fullscreenButton =
        document.getElementById(
            "fullscreen-button"
        );


    const exitButton =
        document.getElementById(
            "exit-button"
        );


    const status =
        document.getElementById(
            "status"
        );



    /* ==========================================
       LIBRARY CHECK
    =========================================== */

    console.log(
        "=============================="
    );

    console.log(
        "WEB ARCADE"
    );

    console.log(
        "Nostalgist:",
        typeof Nostalgist
    );

    console.log(
        "=============================="
    );



    /* ==========================================
       ERROR
    =========================================== */

    function showError(message) {

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            message;

    }


    function clearError() {

        errorBox.style.display =
            "none";

        errorBox.innerHTML =
            "";

    }



    /* ==========================================
       UPLOAD TOGGLE
    =========================================== */

    gameSelect.addEventListener(
        "change",
        function () {

            clearError();


            if (
                gameSelect.value ===
                "upload"
            ) {

                uploadSection.style.display =
                    "block";

            } else {

                uploadSection.style.display =
                    "none";

                romUpload.value =
                    "";

            }

        }
    );



    /* ==========================================
       STOP EMULATOR
    =========================================== */

    async function stopEmulator() {

        if (!emulator) {

            return;

        }


        try {

            emulator.exit({
                removeCanvas: true
            });

        } catch (error) {

            console.warn(
                "Exit warning:",
                error
            );

        }


        emulator = null;


        /*
         * Remove any canvas that
         * Nostalgist may have created.
         */

        gameContainer
            .querySelectorAll("canvas")
            .forEach(
                canvas => canvas.remove()
            );

    }



    /* ==========================================
       GET ROM
    =========================================== */

    function getRom() {

        /*
         * CUSTOM ROM
         */

        if (
            gameSelect.value ===
            "upload"
        ) {

            const file =
                romUpload.files[0];


            if (!file) {

                throw new Error(
                    "Pumili muna ng .ZIP ROM."
                );

            }


            return file;

        }


        /*
         * GITHUB ROM
         */

        return gameSelect.value;

    }



    /* ==========================================
       START GAME
    =========================================== */

    async function startGame() {

        clearError();


        if (
            typeof Nostalgist ===
            "undefined"
        ) {

            showError(
                "Nostalgist.js failed to load."
            );

            return;

        }


        try {

            playButton.disabled =
                true;

            playButton.innerText =
                "LOADING...";


            loading.style.display =
                "block";


            menu.style.display =
                "none";


            gameWrapper.style.display =
                "block";


            /*
             * Stop previous emulator
             */

            await stopEmulator();


            /*
             * Get ROM
             */

            const rom =
                getRom();


            currentRom =
                rom;


            console.log(
                "ROM:",
                rom
            );


            /*
             * ==================================
             * FBNEO
             * ==================================
             *
             * We explicitly resolve the
             * FBNeo Emscripten core.
             */

            emulator =
                await Nostalgist.launch({

                    /*
                     * FBNeo core
                     */

                    core: "fbneo",


                    /*
                     * ROM
                     */

                    rom: rom,


                    /*
                     * IMPORTANT:
                     *
                     * NO element option.
                     *
                     * Nostalgist creates
                     * the canvas itself.
                     */


                    /*
                     * FBNeo JS
                     */

                    resolveCoreJs(
                        core
                    ) {

                        const url =
                            "https://cdn.jsdelivr.net/gh/" +
                            "arianrhodsandlot/" +
                            "retroarch-emscripten-build@" +
                            "1.22.2/retroarch/" +
                            core +
                            "_libretro.js";


                        console.log(
                            "CORE JS:",
                            url
                        );


                        return url;

                    },


                    /*
                     * FBNeo WASM
                     */

                    resolveCoreWasm(
                        core
                    ) {

                        const url =
                            "https://cdn.jsdelivr.net/gh/" +
                            "arianrhodsandlot/" +
                            "retroarch-emscripten-build@" +
                            "1.22.2/retroarch/" +
                            core +
                            "_libretro.wasm";


                        console.log(
                            "CORE WASM:",
                            url
                        );


                        return url;

                    },


                    /*
                     * ROM
                     */

                    resolveRom(
                        filename
                    ) {

                        const url =
                            "./roms/" +
                            filename;


                        console.log(
                            "ROM URL:",
                            url
                        );


                        return url;

                    },


                    /*
                     * Cache
                     */

                    cache: {

                        core: true,

                        rom: true,

                        bios: true

                    },


                    /*
                     * Canvas styling
                     */

                    style: {

                        position:
                            "static",

                        width:
                            "100%",

                        height:
                            "100%",

                        backgroundColor:
                            "black"

                    }

                });


            /*
             * ==================================
             * MOVE AUTO-CREATED CANVAS
             * ==================================
             */

            const canvas =
                emulator.getCanvas();


            if (!canvas) {

                throw new Error(
                    "Nostalgist started, but no canvas was created."
                );

            }


            /*
             * Put canvas inside our game box.
             */

            gameContainer.appendChild(
                canvas
            );


            /*
             * Canvas CSS
             */

            canvas.style.position =
                "static";

            canvas.style.width =
                "100%";

            canvas.style.height =
                "100%";

            canvas.style.maxWidth =
                "100%";

            canvas.style.maxHeight =
                "100%";

            canvas.style.display =
                "block";


            /*
             * Success
             */

            loading.style.display =
                "none";


            status.innerText =
                "FBNeo • GAME RUNNING";


            console.log(
                "================================"
            );

            console.log(
                "FBNEO STARTED SUCCESSFULLY"
            );

            console.log(
                "================================"
            );


        } catch (error) {

            console.error(
                "================================"
            );

            console.error(
                "FBNEO ERROR:",
                error
            );

            console.error(
                "================================"
            );


            loading.style.display =
                "none";


            gameWrapper.style.display =
                "none";


            menu.style.display =
                "flex";


            showError(

                "EMULATOR ERROR:<br><br>" +

                (
                    error.message ||
                    String(error)
                )

            );

        } finally {

            playButton.disabled =
                false;

            playButton.innerText =
                "▶ PLAY START";

        }

    }



    /* ==========================================
       RESTART
    =========================================== */

    restartButton.addEventListener(
        "click",
        async function () {

            if (!currentRom) {

                return;

            }


            clearError();


            try {

                await stopEmulator();


                const rom =
                    currentRom;


                emulator =
                    await Nostalgist.launch({

                        core:
                            "fbneo",

                        rom:
                            rom,


                        resolveCoreJs(
                            core
                        ) {

                            return (
                                "https://cdn.jsdelivr.net/gh/" +
                                "arianrhodsandlot/" +
                                "retroarch-emscripten-build@" +
                                "1.22.2/retroarch/" +
                                core +
                                "_libretro.js"
                            );

                        },


                        resolveCoreWasm(
                            core
                        ) {

                            return (
                                "https://cdn.jsdelivr.net/gh/" +
                                "arianrhodsandlot/" +
                                "retroarch-emscripten-build@" +
                                "1.22.2/retroarch/" +
                                core +
                                "_libretro.wasm"
                            );

                        },


                        resolveRom(
                            filename
                        ) {

                            return (
                                "./roms/" +
                                filename
                            );

                        },


                        cache: {

                            core: true,

                            rom: true,

                            bios: true

                        },


                        style: {

                            position:
                                "static",

                            width:
                                "100%",

                            height:
                                "100%",

                            backgroundColor:
                                "black"

                        }

                    });


                const canvas =
                    emulator.getCanvas();


                if (canvas) {

                    gameContainer.appendChild(
                        canvas
                    );


                    canvas.style.position =
                        "static";

                    canvas.style.width =
                        "100%";

                    canvas.style.height =
                        "100%";

                    canvas.style.display =
                        "block";

                }


                status.innerText =
                    "FBNeo • RESTARTED";


            } catch (error) {

                console.error(
                    "Restart error:",
                    error
                );


                showError(
                    error.message ||
                    String(error)
                );

            }

        }
    );



    /* ==========================================
       FULLSCREEN
    =========================================== */

    fullscreenButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await gameWrapper.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );

            }

        }
    );



    /* ==========================================
       EXIT
    =========================================== */

    exitButton.addEventListener(
        "click",
        async function () {

            await stopEmulator();


            gameWrapper.style.display =
                "none";


            menu.style.display =
                "flex";


            loading.style.display =
                "none";


            currentRom =
                null;


            status.innerText =
                "FBNeo • Ready";


            clearError();

        }
    );



    /* ==========================================
       PLAY
    ========================================== */

    playButton.addEventListener(
        "click",
        startGame
    );


</script>

</body>

</html>
