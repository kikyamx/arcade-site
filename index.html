<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WEB ARCADE - MAME</title>

    <!-- Nostalgist.js -->
    <script src="https://unpkg.com/nostalgist"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            background:
                radial-gradient(
                    circle at top,
                    #11112b 0%,
                    #050510 45%,
                    #000000 100%
                );

            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            display: flex;

            flex-direction: column;

            align-items: center;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* ============================
           HEADER
        ============================ */

        .header {

            width: 100%;

            text-align: center;

            padding:
                30px
                15px
                10px;
        }


        h1 {

            margin: 0;

            color: #ff0055;

            font-size:
                clamp(
                    2rem,
                    6vw,
                    3.5rem
                );

            text-shadow:
                0 0 5px #ff0055,
                0 0 15px #ff0055,
                0 0 30px #ff0055;
        }


        .subtitle {

            margin-top: 8px;

            color: #00ffcc;

            font-size: 16px;

            font-weight: bold;

            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc;
        }


        /* ============================
           MENU
        ============================ */

        #menu {

            width:
                calc(100% - 30px);

            max-width: 650px;

            margin:
                25px 15px;

            padding: 24px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.88
                );

            border:
                2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.25
                );

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        label {

            color: #00ffcc;

            font-weight: bold;

            font-size: 16px;
        }


        select,
        input[type="file"] {

            width: 100%;

            padding: 12px;

            background: #111;

            color: white;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            outline: none;

            font-family: inherit;

            font-size: 16px;
        }


        select:focus,
        input[type="file"]:focus {

            border-color: #00ffcc;

            box-shadow:
                0 0 8px #00ffcc;
        }


        option {

            background: #111;

            color: white;
        }


        /* ============================
           UPLOAD
        ============================ */

        #upload-section {

            display: none;

            padding: 15px;

            border:
                1px dashed #ffcc00;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    204,
                    0,
                    0.03
                );
        }


        #upload-section label {

            color: #ffcc00;
        }


        /* ============================
           BUTTON
        ============================ */

        button {

            width: 100%;

            padding: 14px;

            background: transparent;

            color: #ff0055;

            border:
                2px solid #ff0055;

            border-radius: 5px;

            cursor: pointer;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            text-transform: uppercase;

            box-shadow:
                0 0 10px #ff0055 inset,
                0 0 10px #ff0055;

            transition: 0.2s;
        }


        button:hover {

            background: #ff0055;

            color: white;
        }


        button:disabled {

            opacity: 0.5;

            cursor: wait;
        }


        /* ============================
           ERROR
        ============================ */

        #error {

            display: none;

            padding: 14px;

            color: #ff0055;

            border:
                1px solid #ff0055;

            border-radius: 5px;

            background:
                rgba(
                    255,
                    0,
                    85,
                    0.08
                );

            text-align: center;

            line-height: 1.5;

            font-weight: bold;
        }


        /* ============================
           LOADING
        ============================ */

        #loading {

            display: none;

            margin: 20px;

            color: #ffcc00;

            font-size: 17px;

            font-weight: bold;

            text-align: center;

            text-shadow:
                0 0 5px #ffcc00;
        }


        /* ============================
           GAME
        ============================ */

        #game-wrapper {

            display: none;

            width: 100%;

            max-width: 1000px;

            padding:
                10px
                15px
                30px;
        }


        #game-container {

            position: relative;

            width: 100%;

            aspect-ratio: 4 / 3;

            min-height: 300px;

            background: #000;

            border:
                2px solid #00ffcc;

            border-radius: 8px;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            box-shadow:
                0 0 10px #00ffcc,
                0 0 30px
                rgba(
                    0,
                    255,
                    204,
                    0.25
                );
        }


        /*
         * IMPORTANT:
         * Nostalgist needs a CANVAS.
         */

        #game-canvas {

            display: block;

            width: 100%;

            height: 100%;

            max-width: 100%;

            max-height: 100%;

            image-rendering: pixelated;

            background: #000;
        }


        /* ============================
           CONTROLS
        ============================ */

        .controls {

            display: flex;

            gap: 10px;

            margin-top: 12px;
        }


        .controls button {

            flex: 1;

            font-size: 14px;

            padding: 10px;
        }


        .restart {

            color: #ffcc00;

            border-color: #ffcc00;

            box-shadow:
                0 0 10px
                #ffcc00 inset,
                0 0 10px
                #ffcc00;
        }


        .restart:hover {

            background: #ffcc00;

            color: #000;
        }


        .fullscreen {

            color: #00ffcc;

            border-color: #00ffcc;

            box-shadow:
                0 0 10px
                #00ffcc inset,
                0 0 10px
                #00ffcc;
        }


        .fullscreen:hover {

            background: #00ffcc;

            color: #000;
        }


        /* ============================
           STATUS
        ============================ */

        #status {

            margin-top: 10px;

            color: #777;

            text-align: center;

            font-size: 12px;
        }


        /* ============================
           FOOTER
        ============================ */

        footer {

            margin-top: auto;

            padding: 20px;

            color: #555;

            font-size: 11px;

            text-align: center;
        }


        /* ============================
           MOBILE
        ============================ */

        @media (max-width: 600px) {

            #menu {

                padding: 18px;
            }


            #game-container {

                min-height: 240px;
            }


            .controls {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ============================
         HEADER
    ============================ -->

    <div class="header">

        <h1>
            WEB ARCADE
        </h1>

        <div class="subtitle">
            MAME / FBNEO EMULATOR
        </div>

    </div>



    <!-- ============================
         MENU
    ============================ -->

    <div id="menu">

        <label>
            SELECT A GAME
        </label>


        <select id="game-select">

            <option value="ddsomur1.zip">

                Dungeons & Dragons:
                Shadow over Mystara

            </option>


            <option value="upload">

                -- UPLOAD CUSTOM ROM --

            </option>

        </select>


        <!-- UPLOAD -->

        <div id="upload-section">

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br>
            <br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <!-- PLAY -->

        <button id="play-button">

            ▶ PLAY START

        </button>


        <!-- ERROR -->

        <div id="error"></div>

    </div>



    <!-- ============================
         LOADING
    ============================ -->

    <div id="loading">

        ⏳ LOADING EMULATOR...

        <br><br>

        Please wait...

    </div>



    <!-- ============================
         GAME
    ============================ -->

    <div id="game-wrapper">


        <div id="game-container">

            <!--
                IMPORTANT:
                This MUST be a CANVAS.
            -->

            <canvas
                id="game-canvas"
                tabindex="0"
            ></canvas>

        </div>


        <div class="controls">

            <button
                class="restart"
                id="restart-button"
            >
                ↻ RESTART
            </button>


            <button
                class="fullscreen"
                id="fullscreen-button"
            >
                ⛶ FULLSCREEN
            </button>


            <button
                id="exit-button"
            >
                ✕ EXIT
            </button>

        </div>


        <div id="status">

            MAME 2003-Plus

        </div>

    </div>



    <footer>

        WEB ARCADE
        •
        Powered by Nostalgist.js

    </footer>



    <script>


        /* ========================================
           VARIABLES
        ======================================== */

        let emulator = null;

        let currentRom = null;



        /* ========================================
           ELEMENTS
        ======================================== */

        const menu =
            document.getElementById(
                "menu"
            );


        const gameSelect =
            document.getElementById(
                "game-select"
            );


        const uploadSection =
            document.getElementById(
                "upload-section"
            );


        const romUpload =
            document.getElementById(
                "rom-upload"
            );


        const playButton =
            document.getElementById(
                "play-button"
            );


        const errorBox =
            document.getElementById(
                "error"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const gameWrapper =
            document.getElementById(
                "game-wrapper"
            );


        const gameCanvas =
            document.getElementById(
                "game-canvas"
            );


        const gameContainer =
            document.getElementById(
                "game-container"
            );


        const restartButton =
            document.getElementById(
                "restart-button"
            );


        const fullscreenButton =
            document.getElementById(
                "fullscreen-button"
            );


        const exitButton =
            document.getElementById(
                "exit-button"
            );


        const status =
            document.getElementById(
                "status"
            );



        /* ========================================
           CHECK LIBRARY
        ======================================== */

        console.log(
            "=============================="
        );

        console.log(
            "WEB ARCADE"
        );

        console.log(
            "Nostalgist:",
            typeof Nostalgist
        );

        console.log(
            "=============================="
        );



        /* ========================================
           ERROR
        ======================================== */

        function showError(message) {

            errorBox.style.display =
                "block";

            errorBox.innerHTML =
                message;

        }


        function clearError() {

            errorBox.style.display =
                "none";

            errorBox.innerHTML =
                "";

        }



        /* ========================================
           ROM SELECT
        ======================================== */

        gameSelect.addEventListener(
            "change",
            function () {

                clearError();


                if (
                    gameSelect.value ===
                    "upload"
                ) {

                    uploadSection.style.display =
                        "block";

                } else {

                    uploadSection.style.display =
                        "none";

                    romUpload.value =
                        "";

                }

            }
        );



        /* ========================================
           STOP EMULATOR
        ======================================== */

        async function stopEmulator() {

            if (!emulator) {

                return;

            }


            try {

                emulator.exit({
                    removeCanvas: false
                });

            } catch (error) {

                console.warn(
                    "Emulator exit:",
                    error
                );

            }


            emulator = null;

        }



        /* ========================================
           GET ROM
        ======================================== */

        function getRom() {


            /*
             * CUSTOM UPLOAD
             */

            if (
                gameSelect.value ===
                "upload"
            ) {

                const file =
                    romUpload.files[0];


                if (!file) {

                    throw new Error(
                        "Pumili muna ng .ZIP ROM."
                    );

                }


                return file;

            }


            /*
             * GITHUB ROM
             */

            return gameSelect.value;

        }



        /* ========================================
           START GAME
        ======================================== */

        async function startGame() {

            clearError();


            /*
             * Check Nostalgist
             */

            if (
                typeof Nostalgist ===
                "undefined"
            ) {

                showError(
                    "Nostalgist.js is not loaded."
                );

                return;

            }


            try {

                playButton.disabled =
                    true;

                playButton.innerText =
                    "LOADING...";


                loading.style.display =
                    "block";


                menu.style.display =
                    "none";


                gameWrapper.style.display =
                    "block";


                /*
                 * Stop old emulator
                 */

                await stopEmulator();


                /*
                 * Get ROM
                 */

                const rom =
                    getRom();


                currentRom =
                    rom;


                console.log(
                    "ROM:",
                    rom
                );


                /*
                 * =================================
                 * LAUNCH
                 * =================================
                 *
                 * IMPORTANT:
                 *
                 * element = CANVAS
                 *
                 * NOT DIV.
                 *
                 */

                emulator =
                    await Nostalgist.launch({

                        /*
                         * Use MAME 2003-Plus
                         *
                         * Current Nostalgist docs
                         * support this core by default.
                         */

                        core:
                            "mame2003_plus",


                        /*
                         * ROM
                         */

                        rom:
                            rom,


                        /*
                         * CANVAS
                         */

                        element:
                            gameCanvas,


                        /*
                         * GitHub Pages ROM
                         */

                        resolveRom(
                            filename
                        ) {

                            const url =
                                "./roms/" +
                                filename;


                            console.log(
                                "ROM URL:",
                                url
                            );


                            return url;

                        },


                        /*
                         * Cache core + ROM
                         */

                        cache: {

                            core: true,

                            rom: true,

                            bios: true

                        }

                    });


                /*
                 * SUCCESS
                 */

                loading.style.display =
                    "none";


                status.innerText =
                    "MAME 2003-Plus • GAME RUNNING";


                /*
                 * Focus emulator
                 */

                gameCanvas.focus();


                console.log(
                    "GAME STARTED!"
                );

            } catch (error) {

                console.error(
                    "EMULATOR ERROR:",
                    error
                );


                loading.style.display =
                    "none";


                gameWrapper.style.display =
                    "none";


                menu.style.display =
                    "flex";


                showError(

                    "FATAL ERROR:<br><br>" +

                    (
                        error.message ||
                        error
                    )

                );

            } finally {

                playButton.disabled =
                    false;

                playButton.innerText =
                    "▶ PLAY START";

            }

        }



        /* ========================================
           RESTART
        ======================================== */

        restartButton.addEventListener(
            "click",
            async function () {

                if (!currentRom) {

                    return;

                }


                clearError();


                try {

                    await stopEmulator();


                    emulator =
                        await Nostalgist.launch({

                            core:
                                "mame2003_plus",

                            rom:
                                currentRom,

                            element:
                                gameCanvas,

                            resolveRom(
                                filename
                            ) {

                                return (
                                    "./roms/" +
                                    filename
                                );

                            },

                            cache: {

                                core: true,

                                rom: true,

                                bios: true

                            }

                        });


                    gameCanvas.focus();


                    status.innerText =
                        "MAME 2003-Plus • RESTARTED";


                } catch (error) {

                    console.error(
                        error
                    );


                    showError(
                        error.message ||
                        String(error)
                    );

                }

            }
        );



        /* ========================================
           FULLSCREEN
        ======================================== */

        fullscreenButton.addEventListener(
            "click",
            async function () {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await gameWrapper.requestFullscreen();

                    } else {

                        await document.exitFullscreen();

                    }

                } catch (error) {

                    console.error(
                        "Fullscreen:",
                        error
                    );

                }

            }
        );



        /* ========================================
           EXIT
        ======================================== */

        exitButton.addEventListener(
            "click",
            async function () {

                await stopEmulator();


                gameWrapper.style.display =
                    "none";


                menu.style.display =
                    "flex";


                loading.style.display =
                    "none";


                currentRom =
                    null;


                status.innerText =
                    "MAME 2003-Plus";


                clearError();

            }
        );



        /* ========================================
           PLAY
        ======================================== */

        playButton.addEventListener(
            "click",
            startGame
        );


    </script>

</body>

</html>
