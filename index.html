<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WEB ARCADE</title>

    <!-- NOSTALGIST -->
    <script src="https://unpkg.com/nostalgist"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050510;
            color: #00ffcc;

            font-family:
                "Courier New",
                Courier,
                monospace;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
            margin-bottom: 5px;

            color: #ff0055;

            text-shadow:
                0 0 10px #ff0055,
                0 0 25px #ff0055;

            text-align: center;
        }

        h3 {
            margin-top: 0;

            color: #00ffcc;

            text-shadow:
                0 0 5px #00ffcc;

            text-align: center;
        }

        #menu {
            width: 90%;
            max-width: 650px;

            margin-top: 30px;

            padding: 25px;

            background: rgba(0, 0, 0, 0.85);

            border: 2px solid #00ffcc;

            border-radius: 10px;

            box-shadow:
                0 0 15px #00ffcc;

            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        select,
        input[type="file"] {

            width: 100%;

            padding: 12px;

            background: #111;

            color: white;

            border: 1px solid #ff0055;

            border-radius: 5px;

            font-family: inherit;

            font-size: 16px;
        }

        button {

            padding: 15px;

            background: transparent;

            color: #ff0055;

            border: 2px solid #ff0055;

            border-radius: 5px;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 10px #ff0055 inset,
                0 0 10px #ff0055;
        }

        button:hover {

            background: #ff0055;

            color: white;
        }

        #upload-section {
            display: none;

            padding: 15px;

            border: 1px dashed #ffcc00;
        }

        #error {

            display: none;

            padding: 15px;

            color: #ff0055;

            border: 1px solid #ff0055;

            text-align: center;

            line-height: 1.5;
        }

        #loading {

            display: none;

            color: #ffcc00;

            text-align: center;
        }

        #game-wrapper {

            display: none;

            width: 95%;

            max-width: 1000px;

            margin-top: 20px;
        }

        #game-container {

            width: 100%;

            aspect-ratio: 4 / 3;

            background: black;

            border: 2px solid #00ffcc;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }

        canvas {

            max-width: 100%;
            max-height: 100%;
        }

        #controls {

            display: flex;

            gap: 10px;

            margin-top: 10px;
        }

        #controls button {
            flex: 1;
            font-size: 14px;
        }

    </style>
</head>


<body>

    <h1>
        WEB ARCADE
    </h1>

    <h3>
        MAME / FBNEO EMULATOR
    </h3>


    <div id="menu">

        <label>
            SELECT A GAME
        </label>

        <select id="game-select">

            <option value="ddsomur1.zip">
                Dungeons & Dragons:
                Shadow over Mystara
            </option>

            <option value="upload">
                -- UPLOAD CUSTOM ROM --
            </option>

        </select>


        <div id="upload-section">

            <label>
                INSERT ROM (.ZIP)
            </label>

            <br><br>

            <input
                type="file"
                id="rom-upload"
                accept=".zip"
            >

        </div>


        <button id="play-button">
            ▶ PLAY START
        </button>


        <div id="error"></div>

    </div>


    <div id="loading">
        ⏳ Loading emulator...
    </div>


    <div id="game-wrapper">

        <div id="game-container"></div>

        <div id="controls">

            <button id="restart">
                ↻ RESTART
            </button>

            <button id="fullscreen">
                ⛶ FULLSCREEN
            </button>

            <button id="exit">
                ✕ EXIT
            </button>

        </div>

    </div>


<script>

    console.log(
        "WEB ARCADE STARTING..."
    );


    /*
     * =========================================
     * CHECK NOSTALGIST
     * =========================================
     */

    console.log(
        "Nostalgist:",
        typeof Nostalgist
    );


    window.addEventListener(
        "load",
        function () {

            console.log(
                "PAGE LOADED"
            );

            console.log(
                "Nostalgist after page load:",
                typeof Nostalgist
            );

        }
    );


    /*
     * =========================================
     * ELEMENTS
     * =========================================
     */

    const menu =
        document.getElementById(
            "menu"
        );

    const select =
        document.getElementById(
            "game-select"
        );

    const uploadSection =
        document.getElementById(
            "upload-section"
        );

    const upload =
        document.getElementById(
            "rom-upload"
        );

    const play =
        document.getElementById(
            "play-button"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const wrapper =
        document.getElementById(
            "game-wrapper"
        );

    const game =
        document.getElementById(
            "game-container"
        );

    const restart =
        document.getElementById(
            "restart"
        );

    const fullscreen =
        document.getElementById(
            "fullscreen"
        );

    const exit =
        document.getElementById(
            "exit"
        );


    let emulator = null;

    let currentRom = null;


    /*
     * =========================================
     * ERROR
     * =========================================
     */

    function showError(message) {

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            message;

    }


    function clearError() {

        errorBox.style.display =
            "none";

        errorBox.innerHTML =
            "";

    }


    /*
     * =========================================
     * UPLOAD TOGGLE
     * =========================================
     */

    select.addEventListener(
        "change",
        function () {

            clearError();

            if (
                select.value ===
                "upload"
            ) {

                uploadSection.style.display =
                    "block";

            } else {

                uploadSection.style.display =
                    "none";

                upload.value =
                    "";

            }

        }
    );


    /*
     * =========================================
     * STOP EMULATOR
     * =========================================
     */

    async function stopEmulator() {

        if (!emulator) {
            return;
        }

        try {

            emulator.exit({
                removeCanvas: true
            });

        } catch (e) {

            console.warn(
                "Exit error:",
                e
            );

        }

        emulator = null;

        game.innerHTML = "";

    }


    /*
     * =========================================
     * START GAME
     * =========================================
     */

    async function startGame() {

        clearError();


        /*
         * VERY IMPORTANT CHECK
         */

        if (
            typeof Nostalgist ===
            "undefined"
        ) {

            showError(

                "Nostalgist.js was NOT loaded.<br><br>" +

                "Open F12 → Console and check " +
                "the red error message."

            );

            console.error(
                "NOSTALGIST IS UNDEFINED"
            );

            return;
        }


        try {

            play.disabled =
                true;

            play.innerText =
                "LOADING...";


            loading.style.display =
                "block";


            menu.style.display =
                "none";


            wrapper.style.display =
                "block";


            await stopEmulator();


            /*
             * GET ROM
             */

            let rom;


            if (
                select.value ===
                "upload"
            ) {

                rom =
                    upload.files[0];


                if (!rom) {

                    throw new Error(
                        "Please select a ZIP ROM."
                    );

                }

            } else {

                /*
                 * ONLY FILENAME
                 */

                rom =
                    select.value;

            }


            currentRom =
                rom;


            console.log(
                "ROM:",
                rom
            );


            /*
             * =================================
             * LAUNCH FBNEO
             * =================================
             */

            emulator =
                await Nostalgist.launch({

                    core: "fbneo",

                    rom: rom,

                    element:
                        game,


                    /*
                     * GitHub ROM location
                     */

                    resolveRom(
                        filename
                    ) {

                        const url =
                            "./roms/" +
                            filename;

                        console.log(
                            "ROM URL:",
                            url
                        );

                        return url;

                    },

                    cache: true

                });


            loading.style.display =
                "none";


            console.log(
                "FBNeo started successfully."
            );


        } catch (e) {

            console.error(
                "EMULATOR ERROR:",
                e
            );


            loading.style.display =
                "none";


            wrapper.style.display =
                "none";


            menu.style.display =
                "flex";


            showError(

                "EMULATOR ERROR:<br><br>" +

                (
                    e.message ||
                    e
                )

            );

        } finally {

            play.disabled =
                false;

            play.innerText =
                "▶ PLAY START";

        }

    }


    /*
     * =========================================
     * RESTART
     * =========================================
     */

    restart.addEventListener(
        "click",
        async function () {

            if (!currentRom) {
                return;
            }

            clearError();

            await stopEmulator();


            try {

                emulator =
                    await Nostalgist.launch({

                        core: "fbneo",

                        rom: currentRom,

                        element:
                            game,

                        resolveRom(
                            filename
                        ) {

                            return (
                                "./roms/" +
                                filename
                            );

                        },

                        cache: true

                    });

            } catch (e) {

                console.error(e);

                showError(
                    e.message
                );

            }

        }
    );


    /*
     * =========================================
     * FULLSCREEN
     * =========================================
     */

    fullscreen.addEventListener(
        "click",
        async function () {

            if (
                !document.fullscreenElement
            ) {

                await wrapper.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        }
    );


    /*
     * =========================================
     * EXIT
     * =========================================
     */

    exit.addEventListener(
        "click",
        async function () {

            await stopEmulator();


            wrapper.style.display =
                "none";


            menu.style.display =
                "flex";


            currentRom =
                null;

        }
    );


    /*
     * =========================================
     * PLAY
     * =========================================
     */

    play.addEventListener(
        "click",
        startGame
    );

</script>

</body>
</html>
