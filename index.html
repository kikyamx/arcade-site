<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Arcade - MAME/FBNeo</title>
    <style>
        body {
            background-color: #050510;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            text-align: center;
            margin-top: 30px;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        h3 {
            color: #00ffcc;
            margin-top: 0;
            text-shadow: 0 0 5px #00ffcc;
        }
        .menu-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 15px #00ffcc;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
            font-size: 1.2rem;
        }
        select {
            padding: 10px;
            font-size: 16px;
            background: #111;
            color: #fff;
            border: 1px solid #ff0055;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            background: transparent;
            color: #ff0055;
            border: 2px solid #ff0055;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0055 inset, 0 0 10px #ff0055;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover {
            background: #ff0055;
            color: #fff;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background: #000;
            border: 2px solid #00ffcc;
            display: none;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px #00ffcc;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
        #loading {
            color: #ffcc00;
            font-size: 18px;
            display: none;
            text-align: center;
            margin: 20px;
            text-shadow: 0 0 5px #ffcc00;
        }
        .error-message {
            color: #ff0055;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>WEB ARCADE</h1>
    <h3>MAME / FBNEO EMULATOR</h3>

    <div class="menu-container" id="menu">
        <label for="game-select">SELECT A GAME</label>
        <select id="game-select">
            <option value="ddsomur1.zip">DUNGEONS & DRAGONS: SHADOW OVER MYSTRA</option>
        </select>
        <button onclick="startGame()">Play Start</button>
        <div id="error-div" class="error-message"></div>
    </div>

    <h3 id="loading">Naglo-load ang emulator at laro... Pakihintay...</h3>

    <div id="game-container"></div>

    <script type="module">
        let nostalgistInstance = null;

        window.startGame = async function() {
            const gameSelect = document.getElementById('game-select').value;
            const menu = document.getElementById('menu');
            const gameContainer = document.getElementById('game-container');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error-div');
            
            errorDiv.innerHTML = "";
            menu.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Kumukuha ng Nostalgist library
                const { Nostalgist } = await import('https://esm.sh/nostalgist');

                // Linisin kung may nakabukas na laro dati
                if (nostalgistInstance) {
                    nostalgistInstance.exit({ removeCanvas: true });
                    nostalgistInstance = null; 
                }

                gameContainer.style.display = 'flex';

                // Buksan ang laro gamit ang FinalBurn Neo core
                nostalgistInstance = await Nostalgist.launch({
                    core: 'fbneo', 
                    rom: 'roms/' + gameSelect, 
                    element: gameContainer,
                    resolveRom(file) {
                        return 'roms/' + file;
                    }
                });

                loading.style.display = 'none';

            } catch (error) {
                console.error(error);
                loading.style.display = 'none';
                menu.style.display = 'flex';
                gameContainer.style.display = 'none';
                
                errorDiv.innerHTML = `
                    FATAL ERROR:<br><br>
                    ${error.message}<br><br>
                    Check if <b>${gameSelect}</b> is in the <b>/roms/</b> folder.
                `;
            }
        };
    </script>
</body>
</html>
